name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - claude/intelligent-dirac-d54b2g   # also deploy from dev branch while building

jobs:
  deploy:
    name: SSH Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script: |
            set -e

            APP_DIR="/home2/${{ secrets.CPANEL_USERNAME }}/lms"

            echo "==> Pulling latest code..."
            cd $APP_DIR
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "==> Installing dependencies..."
            php composer.phar install --no-dev --optimize-autoloader --no-interaction

            echo "==> Running migrations..."
            php artisan migrate --force

            echo "==> Clearing and rebuilding cache..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link 2>/dev/null || true

            echo "==> Fixing permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "==> Done! Site live at http://lms.outlooknews.com.ng"
